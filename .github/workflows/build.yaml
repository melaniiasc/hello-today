name: 'Lambda Build'

on:
  workflow_call:

jobs:
    terraform_build:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: app

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"


          - name: Install dependencies
            run: |
                pip install -r requirements.txt

          - name: Lint
            run: |
                ruff check .

          - name: Format check
            run: |
                black --check .

          - name: Tests
            run: |
                pytest