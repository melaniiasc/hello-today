name: 'Plan + Apply Terraform'


on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  terraform_plan:
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::090814039522:role/TerraformRole
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download lambda artifact
        uses: actions/download-artifact@v5
        with:
          name: lambda-package
          path: infra/modules/lambda

      - name: Download reader artifact
        uses: actions/download-artifact@v5
        with:
          name: reader-package
          path: infra/modules/lambda

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov==3.3.8

      - name: Run Checkov
        run: checkov -d .

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform lint
        run: tflint --init && tflint

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Save Plan Output
        run: terraform show -json tfplan > plan.json

      - name: Upload Plan File
        uses: actions/upload-artifact@v5
        with:
          name: tfplan
          path: infra/tfplan

      - name: Upload Plan JSON
        uses: actions/upload-artifact@v5
        with:
          name: plan-json
          path: infra/plan.json

  terraform_apply:
    environment:
      name: production
    needs: terraform_plan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::090814039522:role/TerraformRole
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download lambda artifact
        uses: actions/download-artifact@v5
        with:
          name: lambda-package
          path: infra/modules/lambda

      - name: Download reader artifact
        uses: actions/download-artifact@v5
        with:
          name: reader-package
          path: infra/modules/lambda

      - name: Download Terraform plan
        uses: actions/download-artifact@v5
        with:
          name: tfplan
          path: infra

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

